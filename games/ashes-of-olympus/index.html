<title>Пепел Олимпа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Fira+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen canvas game; DOM overlays for HUD, menus and panels. Single dark "bronze & obsidian" look. */
:root{
  --bg:#110d0a; --panel:#1c1611; --panel2:#271f17; --line:#5b4630; --bronze:#d69c48; --bronze2:#f0c47a;
  --marble:#efe7d6; --muted:#ab9b83; --blood:#c4382b; --lapis:#3e72c9; --good:#62c06a;
  --display:'Philosopher',Georgia,'Times New Roman',serif; --body:'Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--marble);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--bronze2);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}

/* ---------- buttons ---------- */
.btn{background:linear-gradient(#3a2c1d,#251b12);border:1px solid var(--line);border-radius:6px;padding:10px 16px;color:var(--marble);font-weight:500;letter-spacing:.02em;transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--bronze)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#b9802f,#8a5b1e);border-color:var(--bronze2);color:#1a1009;font-weight:700}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.screen.dim{background:rgba(10,7,5,.78)}
.wrap{width:100%;max-width:980px;display:flex;flex-direction:column;gap:20px}
.menu{align-items:center;justify-content:center;min-height:100%;text-align:center}
.logo{font-family:var(--display);font-size:clamp(44px,9vw,92px);line-height:.95;letter-spacing:.04em;color:var(--bronze2);text-shadow:0 2px 0 #4a2f12,0 0 40px rgba(214,156,72,.35)}
.logo small{display:block;font-size:.26em;letter-spacing:.42em;color:var(--muted);margin-top:14px;text-transform:uppercase}
.menu-list{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.menu-list .btn{padding:13px 18px;font-size:17px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-title h2{font-size:26px;color:var(--bronze2)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sel{border-color:var(--bronze2);box-shadow:0 0 0 1px var(--bronze2),0 0 24px rgba(214,156,72,.2)}
.card.locked{opacity:.92}
.card h3{font-size:20px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.card .bonus{color:var(--good);font-size:14px}
.card canvas{width:100%;height:120px;background:radial-gradient(ellipse at 50% 80%,#3a2a1a,#15100c 70%);border-radius:6px}
.pill{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.on{color:#1a1009;background:var(--good);border-color:var(--good)}
.pill.gold{color:#1a1009;background:var(--bronze2);border-color:var(--bronze2)}
.codebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
.codebox input{flex:1 1 180px;min-width:0;background:#0d0a08;border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--marble);font:inherit;letter-spacing:.12em;text-transform:uppercase}
.codemsg{width:100%;font-size:14px;min-height:1.2em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--bronze)}
.help{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.help kbd{font-family:var(--body);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:13px;white-space:nowrap}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bars{display:flex;flex-direction:column;gap:5px;width:min(240px,38vw)}
.bar{position:relative;height:16px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block}
.bar.hp i{background:linear-gradient(#e04a3a,#8d1f17)}
.bar.mp i{background:linear-gradient(#5a8fe8,#244c9c)}
.bar span{position:relative;display:block;text-align:center;font-size:11px;line-height:15px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.lvl{font-size:12px;color:var(--bronze2);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.objective{text-align:center;text-shadow:0 1px 3px #000;flex:1;min-width:0}
.objective b{font-family:var(--display);font-size:18px;color:var(--bronze2);display:block}
.objective span{font-size:12px;color:var(--marble)}
#mini{width:140px;height:140px;border:1px solid var(--line);border-radius:6px;background:rgba(0,0,0,.55);flex:none}
.hud-btns{position:absolute;top:166px;right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.hud-btns button{width:140px;background:rgba(28,22,17,.85);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:12px;text-align:left;display:flex;justify-content:space-between}
.hud-btns button kbd{font-family:var(--body);color:var(--muted)}
.hud-btns .dot{color:var(--good)}
#xpBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(520px,70vw);height:6px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:3px;overflow:hidden}
#xpBar i{display:block;height:100%;background:linear-gradient(90deg,#b9802f,#f0c47a)}
#skillbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;pointer-events:auto}
.slot{position:relative;width:54px;height:54px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(#2c2218,#17110c);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.slot .ic{font-family:var(--display);font-size:22px;font-weight:700;color:var(--bronze2)}
.slot .k{position:absolute;left:4px;top:2px;font-size:10px;color:var(--muted)}
.slot .n{position:absolute;right:4px;bottom:2px;font-size:11px;color:var(--marble);font-variant-numeric:tabular-nums}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p,0)*360deg),transparent 0)}
.slot.off .ic{color:#5a4c3c}
.slot.nomana{border-color:var(--lapis)}
#bossbar{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:min(460px,58vw);text-align:center}
#bossbar span{font-family:var(--display);font-size:16px;color:#ffb0a0;text-shadow:0 1px 3px #000}
#bossbar div{height:10px;border:1px solid #6a2a20;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden;margin-top:3px}
#bossbar i{display:block;height:100%;background:linear-gradient(#e0503a,#7a1a12)}
#toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:4px}
.toast{background:rgba(20,15,11,.88);border:1px solid var(--line);border-radius:5px;padding:5px 12px;font-size:13px;animation:fade 2.6s forwards}
@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
#banner{position:absolute;top:30%;left:0;right:0;text-align:center;pointer-events:none;padding-inline:16px}
#banner b{display:block;font-family:var(--display);font-size:clamp(28px,6vw,56px);color:var(--bronze2);text-shadow:0 2px 0 #3a230c,0 0 30px rgba(0,0,0,.8)}
#banner span{display:block;max-width:560px;margin:6px auto 0;font-size:15px;text-shadow:0 1px 3px #000}
#banner.show{animation:fade 4s forwards}

/* touch */
#stick{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;border:2px solid rgba(214,156,72,.35);background:rgba(0,0,0,.25);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(214,156,72,.55)}
.touch #skillbar{left:auto;transform:none;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,58px);gap:8px}
.touch .slot{width:58px;height:58px;border-radius:50%}
.touch .slot.atk{grid-column:3;grid-row:1/3;height:124px;border-radius:30px}
.touch #xpBar{width:40vw}
.touch .hud-btns{top:auto;bottom:calc(230px + env(safe-area-inset-bottom,0px))}
.touch .hud-btns button{width:auto}
.touch .hud-btns kbd{display:none}
@media (max-width:640px){#mini{width:96px;height:96px}.hud-btns{top:116px}.objective b{font-size:15px}}

/* ---------- panels ---------- */
.panel{position:absolute;inset:0;background:rgba(8,6,4,.72);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pbox{width:100%;max-width:860px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.phead h2{font-size:26px;color:var(--bronze2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .btn.on{border-color:var(--bronze2);color:var(--bronze2)}
.eq{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.eqs{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:62px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.eqs .eyebrow{font-size:10px}
.eqs b{font-size:14px;overflow-wrap:anywhere}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item b{font-size:14px;overflow-wrap:anywhere}
.item ul{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .cmp{font-size:12px;font-weight:700}
.up{color:var(--good)} .down{color:var(--blood)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.costumes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.cos{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.cos canvas{width:100%;height:80px}
.cos.sel{border-color:var(--bronze2)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.r0{color:#d8d0c0}.r1{color:#6f9bf5}.r2{color:#f2c94c}.r3{color:#c07af0}.r4{color:#ff9a3a}
@media (prefers-reduced-motion:reduce){.toast,#banner.show{animation-duration:.01s}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="bars">
        <div class="bar hp"><i id="hpFill"></i><span id="hpTxt"></span></div>
        <div class="bar mp"><i id="mpFill"></i><span id="mpTxt"></span></div>
        <div class="lvl" id="lvlTxt"></div>
      </div>
      <div class="objective"><b id="actName"></b><span id="objTxt"></span></div>
      <canvas id="mini" width="280" height="280"></canvas>
    </div>
    <div class="hud-btns">
      <button id="bInv" type="button">Снаряжение <kbd>I</kbd></button>
      <button id="bChar" type="button">Герой <kbd>C</kbd></button>
      <button id="bSk" type="button">Навыки <kbd>K</kbd></button>
      <button id="bMenu" type="button">Меню <kbd>Esc</kbd></button>
    </div>
    <div id="bossbar" hidden><span id="bossName"></span><div><i id="bossFill"></i></div></div>
    <div id="banner"></div>
    <div id="toasts"></div>
    <div id="stick" hidden><div id="knob"></div></div>
    <div id="skillbar"></div>
    <div id="xpBar"><i id="xpFill"></i></div>
  </div>
  <div id="screen" class="screen"></div>
  <div id="panel" class="panel" hidden></div>
</div>

<script>
'use strict';
/* =================== utils =================== */
const $=s=>document.querySelector(s);
const app=$('#app'),cv=$('#cv'),ctx=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a),randi=(a,b)=>Math.floor(rand(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;return'#'+[r,g,b].map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('')}

/* =================== data =================== */
const CLASSES={
  warrior:{name:'Воин',desc:'Мастерство войны. Меч и щит, ближний бой, высокая живучесть.',base:{str:14,dex:8,int:5,vit:13},weapon:'sword',skills:['cleave','warcry','charge','quake'],main:'str'},
  hunter:{name:'Охотник',desc:'Мастерство охоты. Лук, дальний бой, яды и ловушки.',base:{str:8,dex:15,int:6,vit:11},weapon:'bow',skills:['volley','poison','roll','trap'],main:'dex'},
  mage:{name:'Маг стихий',desc:'Мастерство стихий. Посох, огонь, лёд и телепортация.',base:{str:5,dex:8,int:16,vit:10},weapon:'staff',skills:['fireball','frostnova','blink','meteor'],main:'int'},
};
const COSTUMES={
  classic:{name:'Эллин',desc:'Стандартное снаряжение героя Эллады.',bonus:'Без бонуса',body:'#8c2f25',trim:'#d69c48',skin:'#e0b48a',head:'laurel',codes:[],free:true},
  ninja:{name:'Ниндзя',desc:'Тень с Востока. Чёрный костюм, красная повязка.',bonus:'+12% к скорости бега, +5% к шансу крита',mods:{move:.12,crit:5},body:'#1d1d25',trim:'#c62f2f',skin:'#e0b48a',head:'ninja',codes:['NINJA','НИНДЗЯ','SHINOBI']},
  samurai:{name:'Самурай',desc:'Доспех о-ёрой и шлем кабуто с золотыми рогами.',bonus:'+10% к урону',mods:{dmg:.10},body:'#7a1f1f',trim:'#e0c060',skin:'#e0b48a',head:'kabuto',codes:['SAMURAI','САМУРАЙ','BUSHIDO']},
  spartan:{name:'Спартанец',desc:'Бронзовый шлем с гребнем и багровый плащ.',bonus:'+20% к броне',mods:{armor:.20},body:'#9a6a2a',trim:'#c8a050',skin:'#d8a878',head:'spartan',cape:'#a3241c',codes:['SPARTA','СПАРТА','MOLONLABE']},
  pharaoh:{name:'Фараон',desc:'Полосатый немес и золотой урей.',bonus:'+15% к мане, быстрее восстановление маны',mods:{mana:.15,mreg:.5},body:'#ebe0c4',trim:'#2f5fa8',skin:'#c08a5a',head:'nemes',codes:['PHARAOH','ФАРАОН','RA']},
  viking:{name:'Викинг',desc:'Рогатый шлем, рыжая борода и меховой плащ.',bonus:'+12% к здоровью',mods:{hp:.12},body:'#4a5a6a',trim:'#a0724a',skin:'#e8b890',head:'horns',cape:'#7a5a3a',codes:['VALHALLA','ВАЛЬХАЛЛА','SKAL']},
  pirate:{name:'Пират',desc:'Треуголка, повязка на глаз и жажда золота.',bonus:'+30% золота, +3% шанс найти предмет',mods:{gold:.30,luck:.03},body:'#2b3f66',trim:'#efe7d6',skin:'#e0b48a',head:'tricorn',codes:['PIRATE','ПИРАТ','YARR']},
  necro:{name:'Некромант',desc:'Капюшон, зелёные огни глаз, тёмный плащ.',bonus:'3% урона возвращается здоровьем',mods:{leech:.03},body:'#2a1f33',trim:'#7fdc7f',skin:'#b8c8b0',head:'hood',cape:'#1a1222',codes:['NECRO','НЕКРОМАНТ','LICH']},
  cyborg:{name:'Киборг',desc:'Гость из будущего: металл и голубой визор.',bonus:'+12% к скорости атаки',mods:{aspd:.12},body:'#5d6b78',trim:'#33e0ff',skin:'#9aa8b4',head:'visor',codes:['CYBORG','КИБОРГ','2077']},
  gladiator:{name:'Гладиатор',desc:'Сетка, трезубец на щите и рёв арены.',bonus:'+8% к урону, +8% к здоровью',mods:{dmg:.08,hp:.08},body:'#6a4a2a',trim:'#c0c0c0',skin:'#d8a878',head:'gladiator',codes:['ARENA','АРЕНА','GLADIATOR']},
  phoenix:{name:'Феникс',secret:true,desc:'Секретный костюм. Огненный венец и пламенный плащ.',bonus:'Регенерация 1% здоровья/с, один раз за акт воскрешает',mods:{regen:.01,revive:1},body:'#c64a10',trim:'#ffd34d',skin:'#f0c090',head:'phoenix',cape:'#ff7a1a',codes:['PHOENIX','ФЕНИКС']},
  olympian:{name:'Олимпиец',desc:'Золотой доспех победителя. Даётся за прохождение кампании.',bonus:'+10% к урону, здоровью и броне',mods:{dmg:.10,hp:.10,armor:.10},body:'#e8d8a8',trim:'#ffd34d',skin:'#f0c8a0',head:'olympian',cape:'#f5f0e6',codes:['OLYMPUS','ОЛИМП'],reward:true},
};
const SKILLS={
  cleave:{name:'Размашистый удар',ic:'Р',cd:3,mana:6,req:1,desc:'Удар по широкой дуге: 180% урона и отбрасывание.'},
  warcry:{name:'Боевой клич',ic:'К',cd:16,mana:14,req:3,desc:'8 с: +25% урона (+5% за уровень), +30% брони. Оглушает врагов рядом.'},

    maxHp:Math.round(T.hp*hpF*(champ?2.6:1)),dmg:T.dmg*dF*(champ?1.4:1),spd:T.spd,xp:T.xp*(1+.3*(lvl-1))*(champ?3:1),
    aggro:false,atk:rand(0,1),stun:0,slow:1,slowT:0,poison:0,poisonT:0,flash:0,face:1,walk:rand(0,6),ab:{},hx:x,hy:y,dead:false};
  e.hp=e.maxHp;if(boss){e.abT=2;e.mode=null}
  W.en.push(e);return e;
}

/* ground pattern */
function makeGround(A,rng){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle=A.g[0];g.fillRect(0,0,256,256);
  for(let i=0;i<70;i++){g.fillStyle=i%2?A.g[1]:A.g[2];g.globalAlpha=.25+rng()*.3;g.beginPath();const x=rng()*256,y=rng()*256,r=6+rng()*26;
    for(const ox of[-256,0,256])for(const oy of[-256,0,256]){g.moveTo(x+ox+r,y+oy);g.ellipse(x+ox,y+oy,r,r*.6,0,0,Math.PI*2)}g.fill()}
  g.globalAlpha=.35;for(let i=0;i<400;i++){g.fillStyle=rng()<.5?shade(A.g[0],-30):shade(A.g[0],25);g.fillRect(rng()*256,rng()*256,2,2)}
  g.globalAlpha=1;return ctx.createPattern(c,'repeat');
}

/* =================== combat helpers =================== */
function txt(x,y,t,c,big){W.texts.push({x:x+rand(-8,8),y,t:String(t),c,big,life:.9})}
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(.2,1)*sp;W.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),max:.7,c,sz:rand(2,4)})}}
function ring(x,y,r,c){W.parts.push({ring:1,x,y,r,life:.4,max:.4,c})}
function enemiesNear(x,y,r){return W.en.filter(e=>!e.dead&&Math.hypot(e.x-x,e.y-y)<r+e.r)}
function dmgEnemy(e,base,o={}){
  if(e.dead)return;
  const crit=!o.nocrit&&Math.random()*100<D.crit;
  const d=Math.max(1,Math.round(base*(crit?1.8:1)*(o.nocrit?1:rand(.9,1.1))));
  e.hp-=d;e.flash=.1;e.aggro=true;
  txt(e.x,e.y-e.r*2.4,d,crit?'#ffd34d':o.c||'#ffffff',crit);
  if(D.leech&&!o.nocrit)heal(d*D.leech);
  if(o.stun)e.stun=Math.max(e.stun,o.stun*(e.boss?.25:1));
  if(o.slow){e.slow=o.slow;e.slowT=o.slowT||2}
  if(o.poison){e.poison=o.poison;e.poisonT=5}
  if(o.kb&&!e.boss){const a=Math.atan2(e.y-P.y,e.x-P.x);e.x+=Math.cos(a)*o.kb;e.y+=Math.sin(a)*o.kb;collide(e)}
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){

    W.loot.push({x:e.x-30,y:e.y+30,type:'potion'});W.loot.push({x:e.x+30,y:e.y+30,type:'potion'});
    W.portal={x:e.x,y:e.y,t:0};$('#bossbar').hidden=true;
    banner(e.T.n+' повержен','Пройдите в портал, чтобы продолжить путь');saveGame();
  }else{

function dropItem(x,y,lvl,bonus,boss){

function hurtPlayer(amount,src){

function die(){G.state='dead';$('#bossbar').hidden=true;showDeath()}
function collide(o){
  for(const b of W.obst){const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy),m=b.r+o.r*.7;if(d<m&&d>0){o.x=b.x+dx/d*m;o.y=b.y+dy/d*m}}

}

/* =================== player actions =================== */
function aimTarget(){
  if(!G.touch&&mouse.wx!==undefined)return Math.atan2(mouse.wy-(P.y-22),mouse.wx-P.x);
  let best=null,bd=520;for(const e of W.en){if(e.dead)continue;const d=dist(e,P);if(d<bd){bd=d;best=e}}
  if(best)return Math.atan2(best.y-best.r-(P.y-22),best.x-P.x);
  return P.aim;
}
function aimPoint(maxD){
  if(!G.touch&&mouse.wx!==undefined){const dx=mouse.wx-P.x,dy=mouse.wy-P.y,d=Math.hypot(dx,dy);const k=d>maxD?maxD/d:1;return{x:P.x+dx*k,y:P.y+dy*k}}
  let best=null,bd=maxD+60;for(const e of W.en){if(e.dead)continue;const d=dist(e,P);if(d<bd){bd=d;best=e}}
  if(best)return{x:best.x,y:best.y};return{x:P.x+Math.cos(P.aim)*maxD*.6,y:P.y+Math.sin(P.aim)*maxD*.6};
}
function meleeArc(rad,arc,dmg,o){
  const a=P.aim;let hit=0;
  for(const e of W.en){if(e.dead)continue;const dx=e.x-P.x,dy=(e.y-e.r*.5)-(P.y-15),d=Math.hypot(dx,dy);
    if(d<rad+e.r&&Math.abs(angDiff(Math.atan2(dy,dx),a))<arc/2+.2){dmgEnemy(e,dmg,o);hit++}}
  W.parts.push({arc:1,x:P.x,y:P.y-15,r:rad,a,w:arc,life:.18,max:.18,c:o&&o.c||'#fff2d0'});
  return hit;
}
function shoot(o){W.proj.push(Object.assign({owner:'p',life:1.3,r:5,hit:new Set()},o))}
function basicAttack(){
  P.aim=aimTarget();P.atkAnim=1;const d=curDmg();
  if(P.cls==='warrior')meleeArc(88,Math.PI*.65,d,{kb:6});
  else if(P.cls==='hunter')shoot({x:P.x+Math.cos(P.aim)*20,y:P.y-22+Math.sin(P.aim)*20,vx:Math.cos(P.aim)*700,vy:Math.sin(P.aim)*700,dmg:d,kind:'arrow',c:'#e8d8b0'});
  else shoot({x:P.x+Math.cos(P.aim)*26,y:P.y-26+Math.sin(P.aim)*26,vx:Math.cos(P.aim)*540,vy:Math.sin(P.aim)*540,dmg:d,kind:'bolt',c:'#8fd0ff',r:7});
}
function castSkill(i){
  if(G.state!=='play'||G.paused)return;
  const id=CLASSES[P.cls].skills[i];if(!id)return;const S_=SKILLS[id],lv=P.sk[id];
  if(!lv){toast(P.lvl<S_.req?'Навык откроется на '+S_.req+' уровне':'Вложите очко навыка');return}
  if((P.cd[id]||0)>0)return;if(P.mp<S_.mana){toast('Не хватает маны');return}
  P.mp-=S_.mana;P.cd[id]=S_.cd;P.aim=aimTarget();P.atkAnim=1;
  const m=1+.2*(lv-1),D0=curDmg(),a=P.aim;
  switch(id){
    case'cleave':meleeArc(135,Math.PI*.95,D0*1.8*m,{kb:30,c:'#ffd38a'});G.shake+=3;break;
    case'warcry':P.buffs.warcry=8;P.wcMult=1.25+.05*lv;ring(P.x,P.y-10,220,'#ffb04a');enemiesNear(P.x,P.y,220).forEach(e=>{e.stun=Math.max(e.stun,e.boss?.3:1)});toast('Боевой клич!');break;
    case'charge':P.dash={vx:Math.cos(a)*1200,vy:Math.sin(a)*1200,t:.22,hit:new Set(),dmg:D0*2.2*m,stun:1};P.inv_t=.25;break;
    case'quake':enemiesNear(P.x,P.y,210).forEach(e=>dmgEnemy(e,D0*3*m,{stun:1.5,c:'#ffcf7a'}));ring(P.x,P.y,210,'#c89a5a');ring(P.x,P.y,140,'#e8c08a');burst(P.x,P.y,'#a07a4a',40,260);G.shake+=10;break;
    case'volley':{const n=5+Math.floor(lv/2);for(let k=0;k<n;k++){const aa=a+(k-(n-1)/2)*.12;shoot({x:P.x,y:P.y-22,vx:Math.cos(aa)*680,vy:Math.sin(aa)*680,dmg:D0*.9*m,kind:'arrow',c:'#ffe2a0'})}break}
    case'poison':shoot({x:P.x,y:P.y-22,vx:Math.cos(a)*720,vy:Math.sin(a)*720,dmg:D0*1.2*m,kind:'arrow',c:'#8aff6a',pierce:true,poison:D0*.6*m,life:1.6});break;
    case'roll':P.dash={vx:Math.cos(a)*1000,vy:Math.sin(a)*1000,t:.22,roll:true};P.inv_t=.4;break;
    case'trap':{const p=aimPoint(350);W.traps.push({x:p.x,y:p.y,arm:.5,dmg:D0*3.5*m,life:20});break}
    case'fireball':shoot({x:P.x+Math.cos(a)*26,y:P.y-26+Math.sin(a)*26,vx:Math.cos(a)*520,vy:Math.sin(a)*520,dmg:D0*2*m,kind:'fire',c:'#ff8a2a',r:10,aoe:95});break;
    case'frostnova':enemiesNear(P.x,P.y,200).forEach(e=>dmgEnemy(e,D0*1.2*m,{stun:2,slow:.5,slowT:4,c:'#bfeaff'}));ring(P.x,P.y,200,'#9fdfff');burst(P.x,P.y-10,'#d0f0ff',50,280);break;
    case'blink':{const p=aimPoint(330);burst(P.x,P.y-20,'#9fd8ff',20,160);P.x=p.x;P.y=p.y;collide(P);P.inv_t=.3;enemiesNear(P.x,P.y,110).forEach(e=>dmgEnemy(e,D0*m,{stun:.6,c:'#cfe8ff'}));ring(P.x,P.y,110,'#9fd8ff');break}
    case'meteor':{const p=aimPoint(420);W.zones.push({x:p.x,y:p.y,r:150,t:.9,max:.9,dmg:D0*4.5*m,owner:'p',c:'#ff7a2a'});break}
  }
}
function drinkPotion(){
  if(G.state!=='play'||G.paused)return;
  if(P.potions<=0){toast('Зелий нет. Купите их в снаряжении (I)');return}
  if((P.cd.potion||0)>0)return;
  P.potions--;P.cd.potion=1;heal(D.maxHp*.45+20);P.mp=Math.min(D.maxMp,P.mp+D.maxMp*.3);burst(P.x,P.y-20,'#ff5a5a',18,120);
}

/* =================== update =================== */
function update(dt){
  G.t+=dt;
  updatePlayer(dt);
  updateEnemies(dt);
  updateProj(dt);
  for(const z of W.zones){z.t-=dt;if(z.t<=0&&!z.done){z.done=true;
    if(z.owner==='p'){enemiesNear(z.x,z.y,z.r).forEach(e=>dmgEnemy(e,z.dmg,{stun:.8,c:'#ffb070'}));G.shake+=8;burst(z.x,z.y,'#ff8a2a',50,320)}
    else{if(Math.hypot(P.x-z.x,P.y-z.y)<z.r+10)hurtPlayer(z.dmg);burst(z.x,z.y,z.c,30,240);G.shake+=4}
    ring(z.x,z.y,z.r,z.c)}}
  W.zones=W.zones.filter(z=>!z.done);
  for(const t of W.traps){t.arm-=dt;t.life-=dt;if(t.arm<=0&&!t.done&&enemiesNear(t.x,t.y,55).length){t.done=true;enemiesNear(t.x,t.y,170).forEach(e=>dmgEnemy(e,t.dmg,{slow:.4,slowT:3,c:'#ffe08a'}));ring(t.x,t.y,170,'#ffd060');burst(t.x,t.y,'#ffcf6a',40,260);G.shake+=5}}
  W.traps=W.traps.filter(t=>!t.done&&t.life>0);
  for(const p of W.parts){p.life-=dt;if(!p.ring&&!p.arc){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92}}
  W.parts=W.parts.filter(p=>p.life>0);
  for(const t of W.texts){t.life-=dt;t.y-=40*dt}
  W.texts=W.texts.filter(t=>t.life>0);
  if(W.en.some(e=>e.dead))W.en=W.en.filter(e=>!e.dead);
  G.shake*=.88;
  // camera
  G.cam.x+=(P.x-G.cam.x)*Math.min(1,dt*8);G.cam.y+=(P.y-G.cam.y)*Math.min(1,dt*8);
  G.saveT=(G.saveT||0)+dt;if(G.saveT>15){G.saveT=0;saveGame()}
}
function updatePlayer(dt){
  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;
  if(joy.on){mx+=joy.x;my+=joy.y}
  const len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len}
  if(P.dash){
    P.x+=P.dash.vx*dt;P.y+=P.dash.vy*dt;P.dash.t-=dt;collide(P);
    if(P.dash.hit)for(const e of enemiesNear(P.x,P.y,30))if(!P.dash.hit.has(e)){P.dash.hit.add(e);dmgEnemy(e,P.dash.dmg,{stun:P.dash.stun,kb:20})}
    if(P.dash.t<=0)P.dash=null;P.walk+=dt*20;
  }else{
    P.x+=mx*D.move*dt;P.y+=my*D.move*dt;collide(P);
  }
  P.moving=len>.1;if(P.moving){P.walk+=dt*11;if(G.touch)P.aim=Math.atan2(my,mx)}
  if(!G.touch&&mouse.has){mouse.wx=mouse.x/G.zoom+(G.cx||0);mouse.wy=mouse.y/G.zoom+(G.cy||0);P.aim=Math.atan2(mouse.wy-(P.y-22),mouse.wx-P.x)}
  P.face=Math.cos(P.aim)>=0?1:-1;
  for(const k in P.cd)if(P.cd[k]>0)P.cd[k]-=dt;
  for(const k in P.buffs){P.buffs[k]-=dt;if(P.buffs[k]<=0)delete P.buffs[k]}
  P.inv_t=Math.max(0,P.inv_t-dt);P.atkT-=dt;P.atkAnim=Math.max(0,P.atkAnim-dt*4);P.hurt=Math.max(0,(P.hurt||0)-dt);
  heal(D.hpReg*dt);P.mp=Math.min(D.maxMp,P.mp+D.mpReg*dt);
  if((mouse.down||keys.Space||touchAtk)&&P.atkT<=0&&!P.dash){basicAttack();P.atkT=1/D.aspd}
  // pickup
  for(const l of W.loot){if(l.got)continue;if(Math.hypot(l.x-P.x,l.y-P.y)<48){
    if(l.type==='gold'){const g=Math.round(l.amt*D.gold);P.gold+=g;txt(l.x,l.y-20,'+'+g+' з.','#ffd34d');l.got=true}
    else if(l.type==='potion'){P.potions=Math.min(25,P.potions+1);txt(l.x,l.y-20,'+ зелье','#ff8a7a');l.got=true}
    else if(P.inv.length<30){P.inv.push(l.item);l.got=true;toast('<span class="r'+l.item.rar+'">'+esc(l.item.name)+'</span>'+(itemScore(l.item)>itemScore(P.eq[l.item.slot])?' <span class="up">▲ лучше надетого</span>':''))}
    else if(!G.fullT||G.t-G.fullT>3){G.fullT=G.t;toast('Сумка полна: продайте лишнее (I)')}
  }}
  W.loot=W.loot.filter(l=>!l.got);
  if(W.portal){W.portal.t+=dt;if(Math.hypot(W.portal.x-P.x,W.portal.y-P.y)<45)nextAct()}
}
function updateEnemies(dt){
  for(const e of W.en){
    if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);
    if(e.poisonT>0){e.poisonT-=dt;e.pT=(e.pT||0)+dt;if(e.pT>=.5){e.pT=0;dmgEnemy(e,e.poison*.5,{nocrit:true,c:'#8aff6a'});if(e.dead)continue}}
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slow=1}
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);
    if(Math.abs(dx)>1400||Math.abs(dy)>1100){continue}
    if(!e.aggro&&d<(e.boss?520:380))e.aggro=true;
    if(e.boss&&e.aggro){$('#bossbar').hidden=false;$('#bossName').textContent=e.T.n+' · ур. '+e.lvl;$('#bossFill').style.width=(e.hp/e.maxHp*100)+'%'}
    if(e.stun>0){e.stun-=dt;continue}
    e.atk-=dt;
    if(!e.aggro){e.walk+=dt*2;continue}
    e.face=dx>=0?1:-1;
    let sp=e.spd*e.slow,mvx=0,mvy=0;
    if(e.boss){if(bossAI(e,dt,d,dx,dy))continue}
    if(e.T.ranged){
      if(d>300){mvx=dx/d;mvy=dy/d}else if(d<170){mvx=-dx/d;mvy=-dy/d}
      if(e.atk<=0&&d<520){e.atk=rand(1.4,2.1);const a=Math.atan2(P.y-22-(e.y-e.r),dx);
        W.proj.push({owner:'e',x:e.x,y:e.y-e.r,vx:Math.cos(a)*330,vy:Math.sin(a)*330,dmg:e.dmg,life:2,r:6,c:e.T.pc||'#fff',kind:'orb'})}
    }else{
      const reach=e.r+16;
      if(d>reach){mvx=dx/d;mvy=dy/d}
      else if(e.atk<=0){e.atk=1.1;e.lunge=.15;hurtPlayer(e.dmg)}
    }
    // separation
    for(const o of W.en){if(o===e||o.dead)continue;const ox=e.x-o.x,oy=e.y-o.y,od=Math.hypot(ox,oy),m=e.r+o.r;if(od<m&&od>0){mvx+=ox/od*.6;mvy+=oy/od*.6}}
    e.x+=mvx*sp*dt;e.y+=mvy*sp*dt;collide(e);
    if(mvx||mvy)e.walk+=dt*(sp/12);
    e.lunge=Math.max(0,(e.lunge||0)-dt);
  }
}
function bossAI(e,dt,d,dx,dy){
  if(e.mode==='charge'){
    e.mt-=dt;if(e.mt>.5)return true; // wind-up
    e.x+=e.cvx*dt;e.y+=e.cvy*dt;collide(e);e.walk+=dt*20;
    if(Math.hypot(P.x-e.x,P.y-e.y)<e.r+20&&!e.chit){e.chit=true;hurtPlayer(e.dmg*1.5)}
    if(e.mt<=0)e.mode=null;return true;
  }
  e.abT-=dt;
  if(e.abT<=0){
    const ab=pick(e.T.abil);e.abT=rand(2.8,4.2);
    if(ab==='burst'){const n=14,off=rand(0,1);for(let i=0;i<n;i++){const a=i/n*Math.PI*2+off;W.proj.push({owner:'e',x:e.x,y:e.y-e.r,vx:Math.cos(a)*260,vy:Math.sin(a)*260,dmg:e.dmg*.8,life:3,r:8,c:e.T.pc||'#ff7a5a',kind:'orb'})}}
    if(ab==='slam'){for(let i=0;i<3;i++){const ox=i?rand(-140,140):0,oy=i?rand(-140,140):0;W.zones.push({x:P.x+ox,y:P.y+oy,r:i?80:110,t:1.1,max:1.1,dmg:e.dmg*1.3,owner:'e',c:'#ff5a3a'})}}
    if(ab==='summon'){const alive=W.en.filter(m=>m.minion&&!m.dead).length;if(alive<8){for(let i=0;i<3;i++){const m=spawn(e.T.minion,e.x+rand(-90,90),e.y+rand(-90,90),Math.max(1,e.lvl-2));m.minion=true;m.aggro=true;burst(m.x,m.y,'#a080ff',12,120)}W.total+=3}}
    if(ab==='charge'){e.mode='charge';e.mt=1.1;e.chit=false;const a=Math.atan2(dy,dx);e.cvx=Math.cos(a)*620;e.cvy=Math.sin(a)*620;toast(e.T.n+' готовится к рывку!')}
    return true;
  }
  return false;
}
function updateProj(dt){
  for(const p of W.proj){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(blocked(p.x,p.y+10,2)&&p.kind!=='orb'){p.life=0;if(p.aoe)explode(p);continue}
    if(p.owner==='p'){
      for(const e of W.en){if(e.dead||p.hit.has(e))continue;
        if(Math.hypot(e.x-p.x,(e.y-e.r)-p.y)<e.r+p.r){
          p.hit.add(e);
          if(p.aoe){explode(p);p.life=0;break}
          dmgEnemy(e,p.dmg,{poison:p.poison,c:p.poison?'#8aff6a':null});
          if(!p.pierce){p.life=0;break}
        }}
    }else{
      if(Math.hypot(P.x-p.x,P.y-22-p.y)<14+p.r){hurtPlayer(p.dmg);p.life=0}
    }
  }
  W.proj=W.proj.filter(p=>{if(p.life<=0&&p.aoe&&!p.exp)explode(p);return p.life>0});
}
function explode(p){if(p.exp)return;p.exp=true;enemiesNear(p.x,p.y+20,p.aoe).forEach(e=>dmgEnemy(e,p.dmg,{c:'#ffb070'}));burst(p.x,p.y,'#ff8a2a',26,220);ring(p.x,p.y+10,p.aoe,'#ffb060')}

function nextAct(){

/* =================== input =================== */
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  keys[e.code]=true;
  if(G.state!=='play')return;
  if(e.code==='Space')e.preventDefault();
  if(e.code==='Escape'){G.panel?closePanel():openPanel('menu');return}
  if(e.code==='KeyI'){G.panel==='inv'?closePanel():openPanel('inv');return}
  if(e.code==='KeyC'){G.panel==='char'?closePanel():openPanel('char');return}
  if(e.code==='KeyK'){G.panel==='sk'?closePanel():openPanel('sk');return}
  if(G.paused)return;
  const si=SKEYS.indexOf(e.code);if(si>=0&&!e.repeat)castSkill(si);
  if(e.code==='KeyQ'&&!e.repeat)drinkPotion();
});
window.addEventListener('keyup',e=>{keys[e.code]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;touchAtk=false});
function updMouse(e){const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.has=true;mouse.wx=mouse.x/G.zoom+(G.cx||0);mouse.wy=mouse.y/G.zoom+(G.cy||0)}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')updMouse(e)});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'){if(!G.touch){G.touch=true;if(G.state==='play'){app.classList.add('touch');$('#stick').hidden=false;buildSkillbar()}}return}
  G.touch=false;app.classList.remove('touch');$('#stick').hidden=true;updMouse(e);
  if(e.button===0)mouse.down=true;if(e.button===2)castSkill(0);
});
window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&e.button===0)mouse.down=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// joystick
const stick=$('#stick'),knob=$('#knob');let stickId=null;
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);joy.on=true;moveStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});
['pointerup','pointercancel'].forEach(ev=>stick.addEventListener(ev,e=>{if(e.pointerId!==stickId)return;stickId=null;joy.on=false;joy.x=joy.y=0;knob.style.transform=''}));
function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=r.width/2-10,d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
$('#bInv').onclick=()=>openPanel('inv');$('#bChar').onclick=()=>openPanel('char');$('#bSk').onclick=()=>openPanel('sk');$('#bMenu').onclick=()=>openPanel('menu');
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'){saveGame();if(!G.paused)openPanel('menu')}});

/* =================== boot =================== */
G.touch=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
resize();
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(G.state==='play'&&!G.paused)update(dt);
  if((G.state==='play'||G.state==='dead')&&W)render();else renderMenuBg(t);
  requestAnimationFrame(loop)}
mainMenu();requestAnimationFrame(loop);
</script>
